<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Trianon</title>
<style>
{{CSS}}
</style>
</head>
<body class="v-empty">
<canvas id="fog"></canvas>
<div class="grain" id="grain"></div>
<div class="edge" id="edge"></div>
<nav class="rail" id="rail" aria-label="导航">
  <i class="cord"></i><i class="knot"></i><i class="tassel"></i>
  <div class="grp">
  </div>
  <div class="grp"><b class="orn2">✦</b>
  </div>
</nav>
<button class="rail-btn" id="railBtn" type="button" aria-label="打开导航"><img src="asset:img/tag_bow.png" alt=""></button>

<div class="app">
  <section class="stage" id="stage">
    <header class="topbar" id="topbar">
      <span class="tb-char" id="tbChar"></span>
      <span class="tb-conn" id="tbConn" hidden><i></i><em id="tbConnTx"></em></span>
    </header>

    <div class="scroll empty vw on" id="vEmpty"><div class="hall">
      <div class="dsep"><span>新 的 信 笺</span></div>
      {{EMPTY}}
    </div></div>

    <div class="scroll chat vw" id="vChat">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer" id="composer">
      <div class="wrap">
        <div class="field" id="field"><i class="lb2"></i>
          <div class="ph" id="ph"><em>Écrivez-moi</em><span class="pht">说一句话⋯</span></div>
          <textarea class="ci" id="ci" rows="1" autocomplete="off" spellcheck="false" aria-label="说一句话"></textarea>
          <button class="watch" id="send" type="button" aria-label="发送" title="Envoyer · 发送">
            <svg viewBox="0 0 48 54" aria-hidden="true">
              <defs>
                <linearGradient id="wCase" x1="0" y1="0" x2="1" y2="1"><stop class="w-s1" offset="0"/><stop class="w-s2" offset=".42"/><stop class="w-s3" offset=".6"/><stop class="w-s4" offset="1"/></linearGradient>
                <radialGradient id="wFace" cx=".42" cy=".36" r=".78"><stop class="w-f1" offset="0"/><stop class="w-f2" offset="1"/></radialGradient>
              </defs>
              <ellipse class="w-bow" cx="24" cy="5.2" rx="4.4" ry="3.6"/>
              <rect class="w-crown" x="20.6" y="7.6" width="6.8" height="5.4" rx="1.6"/>
              <path class="w-knurl" d="M22.2,8.4 V12.2 M24,8.4 V12.2 M25.8,8.4 V12.2"/>
              <circle class="w-case" cx="24" cy="32" r="19.4"/>
              <circle class="w-bezel" cx="24" cy="32" r="16.9"/>
              <circle class="w-face" cx="24" cy="32" r="15.8"/>
              <g class="w-ticks"></g>
              <path class="w-hh" id="wHH" d="M24,33.6 L23.1,31 L24,24.4 L24.9,31 Z"/>
              <path class="w-mh" id="wMH" d="M24,34.6 L23.45,31.2 L24,19 L24.55,31.2 Z"/>
              <circle class="w-cap" cx="24" cy="32" r="1.5"/>
              <path class="w-glint" d="M13.4,25.6 A12.4,12.4 0 0 1 22,19.9"/>
            </svg>
          </button>
          <div class="bar">
            <span class="pill p" id="pPersona" title="当前人设"></span>
            <button class="pill imp" id="pImp" type="button" title="让模型以你的人设代写一段（写进输入框）">✒ 代写</button>
            <div class="mchip" id="mchip" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" title="生成来源与模型"><i class="mc-eye"></i><b class="mc-m" id="mcM"></b><i class="mc-d">·</i><em class="mc-t" id="mcT"></em><svg class="mc-car" width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M2.4,6.4 L5,3.7 L7.6,6.4" fill="none" stroke="#5B6C93" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
          </div>
        </div>

      </div>
      <div class="hint"><em>Entrée</em> 发送 <b>✦</b> <em>Maj + Entrée</em> 换行</div>
    </div>
  </section>
</div>

{{MODEL}}
<div class="soon" id="soon" role="status" aria-live="polite"><em id="soonFr"></em><span id="soonTx"></span></div>

<script>
{{JS}}
</script>
</body>
</html>
